const STORAGE_KEY="kanji_practice_12550_v1";
let quiz=[],index=0,mode="read",retest=false,judgments={};
const byId=id=>document.getElementById(id);
function getMisses(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(x)?x:[];}catch(e){return [];}}
function saveMisses(arr){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...new Set(arr)]));}catch(e){byId("feedback").textContent="保存がブロックされています。ブラウザの設定を確認してください。";} updateMissCount();refreshSaved();}
function updateMissCount(){byId("missCount").textContent="保存中の間違い："+getMisses().length+"問";}
function resetMisses(){if(confirm("保存中の間違いをすべて削除しますか？")){saveMisses([]);}}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scoped(data){const range=byId("range").value;return data.filter(q=>q.mode===mode&&(range==="all"||q.page===range||q.lesson===range));}
function start(isRetest){mode=byId("mode").value;retest=isRetest; const missed=new Set(getMisses());let base=scoped(DATA).filter(q=>!isRetest||missed.has(q.id));if(!base.length){alert(isRetest?"選択した範囲・モードで保存された間違いはありません。":"この範囲には問題がありません。");return;}if(byId("order").value==="random")base=shuffled(base);const n=byId("num").value;quiz=n==="all"?base:base.slice(0,Number(n));index=0;judgments={};byId("setup").classList.add("hidden");byId("quiz").classList.remove("hidden");byId("savedPanel").classList.add("hidden");byId("modeChip").textContent=mode==="read"?"読み":"書き";byId("rangeChip").textContent=byId("range").selectedOptions[0].textContent;byId("retestChip").classList.toggle("hidden",!retest);render();window.scrollTo({top:0,behavior:"smooth"});}
function render(){if(!quiz.length)return;const q=quiz[index];byId("itemCount").textContent=(index+1)+" / "+quiz.length;byId("bar").style.width=((index+1)/quiz.length*100)+"%";byId("questionLabel").textContent=mode==="read"?"赤い語句の読みを書きなさい":"赤いカタカナを漢字に直しなさい";
const parts=q.sentence.split("【");const targetPart=parts[1].split("】");const pre=parts[0],post=targetPart.slice(1).join("】");const shown=mode==="read"?q.target:q.kana;const sentence=pre+"【"+shown+"】"+post; const matched=sentence.match(/^(.*?)【(.*?)】(.*)$/s);const safe=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");byId("question").innerHTML=safe(matched[1])+"<span class='target'>【"+safe(matched[2])+"】</span>"+safe(matched[3]);byId("answerText").textContent=q.answer;byId("answerHint").textContent=q.page+"ページ・"+q.lesson+" ／ 学習漢字「"+q.kanji+"」";byId("answer").classList.add("hidden");byId("answerBtn").textContent="答えを表示する";byId("prevBtn").disabled=index===0;byId("nextBtn").textContent=index===quiz.length-1?"結果を見る":"次の問題";const v=judgments[q.id];byId("feedback").textContent=v===true?"○ 正解として記録しました":v===false?"× 間違いとして保存しました":"答えを確認して自己採点してください";score();}
function toggleAnswer(){byId("answer").classList.toggle("hidden");byId("answerBtn").textContent=byId("answer").classList.contains("hidden")?"答えを表示する":"答えを隠す";}
function grade(correct){const q=quiz[index];judgments[q.id]=correct;const ids=new Set(getMisses());if(correct)ids.delete(q.id);else ids.add(q.id);saveMisses([...ids]);byId("feedback").textContent=correct?"○ 正解として記録しました":"× 間違いとして保存しました";score();}
function score(){const v=Object.values(judgments),right=v.filter(x=>x).length;byId("score").textContent="このテストの自己採点："+right+"問正解 / "+v.length+"問判定済み（全"+quiz.length+"問）";}
function next(){if(index<quiz.length-1){index++;render();window.scrollTo({top:0,behavior:"smooth"});}else{const v=Object.values(judgments);const good=v.filter(Boolean).length;alert("終了："+good+"問正解 / "+v.length+"問判定済み。間違えた問題は次回再テストできます。");goSetup();}}
function previous(){if(index>0){index--;render();window.scrollTo({top:0,behavior:"smooth"});}}
function goSetup(){byId("setup").classList.remove("hidden");byId("quiz").classList.add("hidden");updateMissCount();window.scrollTo({top:0,behavior:"smooth"});}
function toggleList(){byId("savedPanel").classList.toggle("hidden");refreshSaved();}
function refreshSaved(){const el=byId("savedList");if(!el)return;const ids=new Set(getMisses());const missed=DATA.filter(q=>ids.has(q.id));el.replaceChildren();if(!missed.length){el.textContent="保存中の間違いはありません。";return;}missed.forEach(q=>{const d=document.createElement("div");d.className="item";const b=document.createElement("b");b.textContent=q.target;const s=document.createElement("div");s.textContent=(q.mode==="read"?"読み":"書き")+"："+q.answer;const p=document.createElement("span");p.textContent=q.page+"ページ ／ "+q.lesson;d.append(b,s,p);el.appendChild(d);});}
document.addEventListener("keydown",e=>{if(byId("quiz").classList.contains("hidden")||["SELECT","BUTTON","INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;if(e.key==="ArrowLeft"){e.preventDefault();previous();}if(e.key==="ArrowRight"){e.preventDefault();next();}if(e.key===" "){e.preventDefault();toggleAnswer();}});
updateMissCount();
</script></body></html>
